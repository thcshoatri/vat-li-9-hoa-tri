<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đường đua Vật lí 9 | Hòa Trí</title><style>
:root{font-family:Arial,sans-serif;color:#172a46;background:#edf3fa}*{box-sizing:border-box}body{margin:0}header{background:#102c54;color:white;padding:22px max(18px,calc((100% - 1050px)/2))}header strong{font-size:26px}main{max-width:1050px;margin:24px auto;padding:0 16px}.panel{background:white;padding:28px;border-radius:20px;box-shadow:0 6px 22px #1d365219;margin-bottom:18px}h1{font-size:36px;margin:12px 0}h2{margin:10px 0 18px}.muted{color:#51637a;line-height:1.6}button,select{font:inherit;border-radius:12px;border:1px solid #c9d6e8;padding:13px 18px;cursor:pointer}button{font-weight:700;background:#e7eefb;color:#163b72}button.primary{background:#1554cc;color:white;border-color:#1554cc}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.options:has(>button:nth-child(2):last-child) .option{min-height:90px}.option{text-align:left;background:white;border:2px solid #c7d5e8;font-size:22px;min-height:90px}.option.selected{border-color:#1554cc;background:#e9f0ff}.option.correct{border-color:#16814e;background:#e6f8ee}.option.wrong{border-color:#bb3345;background:#fff0f1}.q{font-size:clamp(24px,3vw,34px);font-weight:700;line-height:1.4;margin:28px 0}.pill{display:inline-block;background:#e5edfa;border-radius:30px;padding:8px 13px;font-weight:bold}.feedback{font-size:21px;line-height:1.6;padding:16px;background:#f0f6ff;border-radius:12px;margin-top:18px}.stats{display:flex;gap:15px;flex-wrap:wrap;margin:14px 0}.stats span{padding:10px 15px;background:#eaf1fa;border-radius:12px}select{background:white;max-width:100%}.setup{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.setup label{display:grid;gap:7px;font-weight:bold}.progress{height:9px;background:#dbe5f4;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#185dd7}footer{color:#53637a;font-size:14px;line-height:1.6;padding:10px 0 35px}@media(max-width:650px){.options{grid-template-columns:1fr}.panel{padding:20px}.option{font-size:19px;min-height:70px}h1{font-size:29px}header strong{font-size:21px}}</style></head><body><header><div style="font-size:13px;letter-spacing:2px;color:#a9caff">TRƯỜNG THCS HÒA TRÍ · GIỮA KỲ I · 2026–2027</div><strong>ĐƯỜNG ĐUA VẬT LÍ 9</strong></header><main id="app"></main><script>
const BANK=[{"type": "Trắc nghiệm", "q": "Trong các vật sau, vật nào có động năng lớn nhất?", "options": ["Quả bóng đang bay tới rổ", "Ô tô đang di chuyển trên đường cao tốc", "Viên bi đang lăn trên sàn", "Máy bay đang chuyển động trên bầu trời"], "answer": 3, "ex": "Theo ngữ cảnh thông thường, máy bay có khối lượng và tốc độ lớn nên động năng lớn nhất. Wđ = ½mv²."}, {"type": "Trắc nghiệm", "q": "Một vật ở độ cao h. Khi tăng khối lượng lên 10 lần, giữ nguyên h thì thế năng thay đổi thế nào?", "options": ["Tăng 10 lần", "Giảm 10 lần", "Tăng 100 lần", "Giảm 100 lần"], "answer": 0, "ex": "Wt = 10mh, nên thế năng tỉ lệ thuận với khối lượng."}, {"type": "Trắc nghiệm", "q": "Trường hợp nào có sự chuyển hóa từ động năng thành thế năng rồi ngược lại?", "options": ["Vật rơi từ trên cao xuống", "Vật được ném lên rồi rơi xuống", "Vật lăn từ đỉnh dốc xuống", "Vật chuyển động trên mặt bàn ngang"], "answer": 1, "ex": "Khi vật đi lên, động năng giảm và thế năng tăng; khi rơi xuống thì ngược lại."}, {"type": "Trắc nghiệm", "q": "Con lắc dao động: A và C là hai vị trí biên ở cùng độ cao, B là vị trí thấp nhất. Thế năng lớn nhất, nhỏ nhất ở đâu?", "options": ["A lớn nhất, B nhỏ nhất", "B lớn nhất, C nhỏ nhất", "C lớn nhất, B nhỏ nhất", "A và C lớn nhất, B nhỏ nhất"], "answer": 3, "ex": "Thế năng trọng trường phụ thuộc vào độ cao. Hai vị trí biên cao nhất, B thấp nhất."}, {"type": "Trắc nghiệm", "q": "Biểu thức tính công suất là gì?", "options": ["P = A × t", "P = A / t", "P = t / A", "P = A × t²"], "answer": 1, "ex": "Công suất bằng công thực hiện chia cho thời gian: P = A/t."}, {"type": "Trắc nghiệm", "q": "Vật nào sau đây không có khả năng sinh công trong tình huống đã nêu?", "options": ["Dòng nước lũ đang chảy mạnh", "Viên đạn đang bay", "Búa máy đang rơi", "Hòn đá đang nằm trên mặt đất"], "answer": 3, "ex": "Theo ngữ cảnh câu hỏi gốc, hòn đá nằm yên trên mặt đất không có khả năng sinh công do chuyển động hay độ cao so với mặt đất."}, {"type": "Trắc nghiệm", "q": "Một động cơ thực hiện công 1000 J trong 5 s. Công suất là bao nhiêu?", "options": ["125 W", "200 W", "500 W", "600 W"], "answer": 1, "ex": "P = A/t = 1000/5 = 200 W."}, {"type": "Trắc nghiệm", "q": "Ô tô khối lượng 4 tấn chạy với tốc độ 54 km/h. Động năng bằng bao nhiêu?", "options": ["450 kJ", "69 kJ", "900 kJ", "120 kJ"], "answer": 0, "ex": "m = 4000 kg; v = 15 m/s. Wđ = ½ × 4000 × 15² = 450000 J = 450 kJ."}, {"type": "Trắc nghiệm", "q": "Năng lượng hóa thạch được tạo nên từ đâu?", "options": ["Nguồn nhiên liệu tái tạo", "Đá chứa ít nhất 50% xác động thực vật", "Chỉ dầu mỏ và than đá", "Sự phân hủy xác vật sống qua hàng triệu năm"], "answer": 3, "ex": "Nhiên liệu hóa thạch hình thành từ xác sinh vật qua hàng triệu năm."}, {"type": "Trắc nghiệm", "q": "Giai đoạn đầu của vòng năng lượng theo vòng tuần hoàn nước cần năng lượng từ đâu?", "options": ["Mặt Trời", "Gió", "Dòng chảy", "Sóng biển"], "answer": 0, "ex": "Năng lượng Mặt Trời làm nóng nước và gây bốc hơi."}, {"type": "Đúng / Sai", "q": "Thực vật hấp thụ năng lượng Mặt Trời để chuyển CO₂ và nước thành đường hữu cơ.", "options": ["Đúng", "Sai"], "answer": 0, "ex": "Quang hợp chuyển năng lượng ánh sáng thành hóa năng."}, {"type": "Đúng / Sai", "q": "Xác vật sống bị vùi lấp qua hàng triệu năm có thể hình thành nhiên liệu hóa thạch.", "options": ["Đúng", "Sai"], "answer": 0, "ex": "Đây là nguồn gốc hình thành nhiên liệu hóa thạch."}, {"type": "Đúng / Sai", "q": "Động vật có thể tạo CO₂ và nước từ quá trình phân giải thức ăn.", "options": ["Đúng", "Sai"], "answer": 0, "ex": "Hô hấp tế bào tạo CO₂ và nước."}, {"type": "Đúng / Sai", "q": "Động vật trực tiếp chuyển ánh sáng Mặt Trời thành hóa năng trong dạ dày.", "options": ["Đúng", "Sai"], "answer": 1, "ex": "Động vật nhận hóa năng từ thức ăn, không quang hợp trong dạ dày."}, {"type": "Đúng / Sai", "q": "Trong quá trình búa máy rơi, động năng của búa luôn bằng 0.", "options": ["Đúng", "Sai"], "answer": 1, "ex": "Khi rơi, búa chuyển động nên có động năng."}, {"type": "Đúng / Sai", "q": "Búa máy càng gần cọc thì thế năng trọng trường càng lớn.", "options": ["Đúng", "Sai"], "answer": 1, "ex": "Độ cao giảm thì thế năng giảm."}, {"type": "Đúng / Sai", "q": "Trong quá trình rơi, thế năng của búa chuyển hóa thành động năng.", "options": ["Đúng", "Sai"], "answer": 0, "ex": "Thế năng giảm, động năng tăng khi bỏ qua lực cản."}, {"type": "Đúng / Sai", "q": "Trong quá trình rơi, động năng của búa được bảo toàn.", "options": ["Đúng", "Sai"], "answer": 1, "ex": "Động năng tăng; cơ năng mới có thể bảo toàn nếu bỏ qua lực cản."}, {"type": "Trả lời ngắn", "q": "Vật có khối lượng 2 kg, thế năng 8 J so với mặt đất. Lấy g ≈ 10 N/kg. Độ cao là bao nhiêu?", "options": ["0,4 m", "4 m", "1,6 m", "16 m"], "answer": 0, "ex": "h = Wt/(10m) = 8/(10×2) = 0,4 m."}, {"type": "Trả lời ngắn", "q": "Vật 2 kg bắt đầu rơi từ độ cao 5 m, ban đầu đứng yên. Cơ năng ban đầu bằng bao nhiêu?", "options": ["10 J", "50 J", "100 J", "200 J"], "answer": 2, "ex": "Wc = Wt = 10mh = 10×2×5 = 100 J. Giả thiết ban đầu đứng yên được nêu rõ để tính duy nhất."}, {"type": "Trả lời ngắn", "q": "Dùng lực 150 N kéo xe đi 20 m theo hướng lực. Công thực hiện bằng bao nhiêu?", "options": ["170 J", "300 J", "3000 J", "7500 J"], "answer": 2, "ex": "A = F×s = 150×20 = 3000 J."}, {"type": "Vận dụng", "q": "Hòn bi 20 g ném lên với tốc độ 4 m/s từ độ cao 1,6 m. Động năng lúc ném là bao nhiêu?", "options": ["0,016 J", "0,16 J", "0,32 J", "1,6 J"], "answer": 1, "ex": "m = 0,02 kg. Wđ = ½×0,02×4² = 0,16 J."}, {"type": "Vận dụng", "q": "Hòn bi 20 g ném lên với tốc độ 4 m/s từ độ cao 1,6 m. Bỏ qua cản không khí, độ cao cực đại là bao nhiêu?", "options": ["1,6 m", "2,0 m", "2,4 m", "3,2 m"], "answer": 2, "ex": "Cơ năng lúc ném: 0,16 + 0,02×10×1,6 = 0,48 J. Tại đỉnh Wđ=0, h=0,48/(0,02×10)=2,4 m."}, {"type": "Vận dụng", "q": "Con ngựa kéo xe với lực 80 N đi 4,5 km theo hướng lực. Công bằng bao nhiêu?", "options": ["360 J", "3600 J", "36000 J", "360000 J"], "answer": 3, "ex": "A = 80×4500 = 360000 J."}, {"type": "Vận dụng", "q": "Con ngựa thực hiện công 360000 J trong nửa giờ. Công suất trung bình bằng bao nhiêu?", "options": ["100 W", "200 W", "400 W", "720 W"], "answer": 1, "ex": "t = 1800 s; P = 360000/1800 = 200 W."}, {"type": "Luyện nâng cao", "q": "Khi quang hợp, cây xanh chuyển năng lượng ánh sáng Mặt Trời chủ yếu thành dạng năng lượng nào?", "options": ["Nhiệt năng", "Hóa năng tích trữ trong chất hữu cơ", "Động năng", "Điện năng"], "answer": 1, "ex": "Quang hợp biến đổi quang năng thành hóa năng trong các chất hữu cơ."}, {"type": "Luyện nâng cao", "q": "Một quả bóng được thả rơi từ độ cao 7 m, bỏ qua sức cản không khí. Nhận xét nào đúng?", "options": ["Thế năng tăng dần", "Động năng giảm dần", "Thế năng giảm và động năng tăng", "Cơ năng giảm liên tục"], "answer": 2, "ex": "Trong quá trình rơi tự do, thế năng chuyển hóa thành động năng; cơ năng bảo toàn khi bỏ qua lực cản."}, {"type": "Luyện nâng cao", "q": "Một người kéo thùng hàng bằng lực 120 N theo hướng chuyển động trên quãng đường 25 m. Công của lực kéo là bao nhiêu?", "options": ["300 J", "1 200 J", "3 000 J", "4 800 J"], "answer": 2, "ex": "A = F.s = 120 × 25 = 3000 J."}, {"type": "Luyện nâng cao", "q": "Một động cơ thực hiện công 3 600 J trong 45 giây. Công suất trung bình bằng bao nhiêu?", "options": ["60 W", "80 W", "120 W", "160 W"], "answer": 1, "ex": "P = A/t = 3600/45 = 80 W."}, {"type": "Luyện nâng cao", "q": "Một động cơ kéo vật bằng lực 75 N đi 24 m theo hướng lực trong 40 giây. Công suất trung bình bằng bao nhiêu?", "options": ["30 W", "45 W", "60 W", "90 W"], "answer": 1, "ex": "A = 75 × 24 = 1800 J; P = 1800/40 = 45 W."}, {"type": "Luyện nâng cao", "q": "Một vật khối lượng 3 kg đứng yên ở độ cao 4 m so với mặt đất. Lấy g ≈ 10 N/kg. Thế năng của vật là bao nhiêu?", "options": ["12 J", "40 J", "120 J", "300 J"], "answer": 2, "ex": "Wt = mgh = 3 × 10 × 4 = 120 J."}, {"type": "Luyện nâng cao", "q": "Xét các phát biểu: (1) Cơ năng bằng tổng động năng và thế năng; (2) Đơn vị cơ năng là J; (3) Vật rơi tự do không có lực cản thì cơ năng bảo toàn; (4) Cơ năng luôn bằng động năng trừ thế năng. Có bao nhiêu phát biểu đúng?", "options": ["1", "2", "3", "4"], "answer": 2, "ex": "Các phát biểu (1), (2), (3) đúng. Phát biểu (4) sai vì cơ năng là tổng động năng và thế năng."}, {"type": "Luyện nâng cao", "q": "Một vật khối lượng 2,5 kg ở độ cao 6 m, bắt đầu rơi từ trạng thái nghỉ. Bỏ qua lực cản, lấy g ≈ 10 N/kg. Cơ năng ban đầu là bao nhiêu?", "options": ["25 J", "60 J", "125 J", "150 J"], "answer": 3, "ex": "Ban đầu vật đứng yên nên Wđ = 0; Wc = mgh = 2,5 × 10 × 6 = 150 J."}, {"type": "Luyện nâng cao", "q": "Một vật rơi tự do không có sức cản không khí. Đại lượng nào được bảo toàn trong quá trình rơi?", "options": ["Động năng", "Thế năng", "Cơ năng", "Tốc độ"], "answer": 2, "ex": "Cơ năng Wc = Wđ + Wt được bảo toàn; động năng tăng và thế năng giảm."}, {"type": "Luyện nâng cao", "q": "Một lực kéo 90 N làm vật dịch chuyển 15 m cùng hướng lực trong 30 s. Khẳng định nào đúng?", "options": ["Công bằng 135 J", "Công suất bằng 45 W", "Công suất bằng 90 W", "Công bằng 2700 J"], "answer": 1, "ex": "A = 90 × 15 = 1350 J; P = 1350/30 = 45 W."}];const KEY='hoatri-vatly9-gki-v2';let state={screen:'home',seen:[],wrong:[],index:0,queue:[],selected:null,locked:false,score:0,remaining:30},timer=null;try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){};
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function render(){clearInterval(timer);let el=$('app');if(state.screen==='home'){el.innerHTML=`<section class="panel"><h1>Chinh phục kiến thức Vật lí 9</h1><p class="muted">Luyện trắc nghiệm, Đúng/Sai, trả lời ngắn và vận dụng theo đề cương KHTN 9 và các bài tập biến đổi cùng chủ đề. Có đáp án, giải thích và ôn lại câu sai.</p><div class="stats"><span>Ngân hàng: ${BANK.length} câu</span><span>Đã luyện: ${state.seen.length}</span><span>Cần ôn: ${state.wrong.length}</span><span>Điểm lượt gần nhất: ${state.score}</span></div><div class="setup"><label>Chủ đề<select id="topic"><option value="all">Tất cả</option>${[...new Set(BANK.map(q=>q.type))].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Số câu<select id="count"><option>5</option><option selected>10</option><option>15</option><option>25</option></select></label><label>Thời gian/câu<select id="seconds"><option value="0">Không giới hạn</option><option value="20">20 giây</option><option value="30" selected>30 giây</option><option value="60">60 giây</option></select></label></div><div class="actions"><button class="primary" onclick="start(false)">Bắt đầu luyện tập</button><button onclick="start(true)" ${state.wrong.length?'':'disabled'}>Ôn câu sai</button><button onclick="reset()">Xóa tiến độ</button></div></section><section class="panel"><h2>Hướng dẫn</h2><p class="muted">Mỗi câu đúng được 10 điểm. Sau khi chọn, bấm “Chốt đáp án” để xem lời giải. Thứ tự câu và phương án được đảo ở mỗi lượt. Tiến độ lưu trên trình duyệt hiện tại. Các câu trả lời ngắn và tự luận đã được chuyển thành lựa chọn đáp số để phù hợp với trò chơi.</p></section>`;return}if(state.screen==='end'){el.innerHTML=`<section class="panel"><h1>Hoàn thành lượt chơi!</h1><h2>${state.score} điểm / ${state.queue.length*10} điểm</h2><p class="muted">Đã luyện ${state.seen.length}/${BANK.length} câu; còn ${state.wrong.length} câu cần ôn.</p><div class="actions"><button class="primary" onclick="state.screen='home';render()">Về trang chủ</button><button onclick="start(true)" ${state.wrong.length?'':'disabled'}>Ôn câu sai</button></div></section>`;return}let item=state.queue[state.index],q=BANK[item.id];el.innerHTML=`<div class="stats"><span>Câu ${state.index+1}/${state.queue.length}</span><span>Điểm: ${state.score}</span><span id="clock">${state.remaining?state.remaining+' giây':'Không giới hạn'}</span></div><div class="progress"><div style="width:${state.index/state.queue.length*100}%"></div></div><section class="panel"><span class="pill">${q.type}</span><div class="q">${q.q}</div><div class="options">${item.order.map((o,i)=>`<button class="option ${state.selected===i?'selected':''} ${state.locked?(o===q.answer?'correct':state.selected===i?'wrong':''):''}" onclick="choose(${i})" ${state.locked?'disabled':''}><b>${q.options.length===2?'':'ABCD'[i]+'.'}</b> ${q.options[o]}</button>`).join('')}</div>${state.locked?`<div class="feedback"><b>${item.order[state.selected]===q.answer?'✓ Chính xác!':'↻ Cần ôn thêm.'}</b><p>Đáp án đúng: ${q.options.length===2?'':'ABCD'[item.order.indexOf(q.answer)]+'. '}${q.options[q.answer]}</p><p><b>Giải thích:</b> ${q.ex}</p></div>`:''}<div class="actions">${state.locked?`<button class="primary" onclick="next()">${state.index+1===state.queue.length?'Xem kết quả':'Câu tiếp theo →'}</button>`:`<button class="primary" onclick="lock()" ${state.selected===null?'disabled':''}>Chốt đáp án</button>`}<button onclick="state.screen='home';render()">Trang chủ</button></div></section>`;if(!state.locked&&state.remaining>0){timer=setInterval(()=>{state.remaining--;if($('clock'))$('clock').textContent=state.remaining>0?state.remaining+' giây':'Hết giờ · vẫn có thể trả lời';if(state.remaining<=0)clearInterval(timer)},1000)}}
function start(review){let topic=$('topic')?.value||'all',count=+$('count')?.value||10,seconds=+$('seconds')?.value||30;let ids=review?[...state.wrong]:BANK.map((q,i)=>i).filter(i=>(topic==='all'||BANK[i].type===topic)&&!state.seen.includes(i));if(!ids.length){alert('Không còn câu mới ở chủ đề này. Hãy xóa tiến độ hoặc chọn chủ đề khác.');return}state.queue=shuffle(ids).slice(0,count).map(id=>({id,order:shuffle(BANK[id].options.map((_,i)=>i))}));state.index=0;state.score=0;state.selected=null;state.locked=false;state.seconds=seconds;state.remaining=seconds;state.screen='play';save();render()}
function choose(i){if(state.locked)return;state.selected=i;save();render()}function lock(){if(state.selected===null||state.locked)return;state.locked=true;let item=state.queue[state.index],ok=item.order[state.selected]===BANK[item.id].answer;if(ok){state.score+=10;state.wrong=state.wrong.filter(i=>i!==item.id)}else if(!state.wrong.includes(item.id))state.wrong.push(item.id);if(!state.seen.includes(item.id))state.seen.push(item.id);save();render()}function next(){if(state.index+1>=state.queue.length){state.screen='end'}else{state.index++;state.selected=null;state.locked=false;state.remaining=state.seconds}save();render()}function reset(){if(confirm('Xóa toàn bộ tiến độ đã lưu trên trình duyệt này?')){localStorage.removeItem(KEY);location.reload()}}render();
</script><footer style="max-width:1050px;margin:auto;padding-left:16px">Tài liệu luyện tập phân môn Vật lí 9, kết hợp đề cương và câu vận dụng đã thay đổi dữ kiện. Không thay thế đề kiểm tra chính thức. Một số câu đã diễn đạt rõ giả thiết hoặc chuyển sang dạng lựa chọn đáp số.</footer></body></html>
